services:
  db:
    image: postgres:15-alpine
    container_name: career_quest_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: career_quest
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: .
    container_name: career_quest_backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres_password
      DB_NAME: career_quest
      AI_PROVIDER: mock # Или anthropic
      ANTHROPIC_API_KEY: your_api_key_here
    depends_on:
      - db

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: career_quest_frontend
    restart: always
    ports:
      - "3001:3001"
    environment:
      BACKEND_URL: http://backend:3000
    depends_on:
      - backend

volumes:
  pgdata:
